<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>VGC 로고 모션</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: grid; place-items: center;
  }

  #logo-wrap {
    position: relative;
    width: min(46vh, 46vw);
    aspect-ratio: 1;
  }
  #logo-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    opacity: 0;
    transform: scale(0.86);
    filter: drop-shadow(0 0 0 rgba(240, 153, 78, 0));
    animation:
      logo-in .9s cubic-bezier(.16, 1, .3, 1) .55s forwards,
      logo-float 4.2s ease-in-out 1.6s infinite;
  }
  @keyframes logo-in {
    to {
      opacity: 1;
      transform: scale(1);
      filter: drop-shadow(0 10px 26px rgba(240, 153, 78, .35));
    }
  }
  @keyframes logo-float {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-1.1%) scale(1.008); }
  }

  #ring {
    position: absolute; inset: -6%;
    transform: rotate(-90deg);   
  }
  #ring circle {
    fill: none;
    stroke: #F0994E;
    stroke-width: 3.2%;
    stroke-linecap: round;
    stroke-dasharray: 999;
    stroke-dashoffset: 999;
    opacity: .95;
    animation: ring-draw .62s cubic-bezier(.65, 0, .35, 1) .05s forwards,
               ring-fade .5s ease .95s forwards;
  }
  @keyframes ring-draw { to { stroke-dashoffset: 0; } }
  @keyframes ring-fade { to { opacity: 0; } }

  #glow {
    position: absolute; inset: -18%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(240,153,78,.55), transparent 68%);
    opacity: 0;
    animation: glow-pulse .7s ease-out .58s forwards;
    pointer-events: none;
  }
  @keyframes glow-pulse {
    0%   { opacity: 0;  transform: scale(.7); }
    40%  { opacity: .8; transform: scale(1.05); }
    100% { opacity: 0;  transform: scale(1.25); }
  }

  .petal {
    position: absolute;
    top: -6%;
    width: 14px; height: 14px;
    background: radial-gradient(circle at 35% 35%, #FF7A52, #E14A2C 70%);
    border-radius: 0 60% 0 60%;
    opacity: 0;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    animation-iteration-count: infinite;
    pointer-events: none;
  }
  @keyframes petal-fall-a {
    0%   { opacity: 0; transform: translate(0, 0) rotate(0deg); }
    8%   { opacity: .85; }
    92%  { opacity: .7; }
    100% { opacity: 0; transform: translate(6vw, 112vh) rotate(340deg); }
  }
  @keyframes petal-fall-b {
    0%   { opacity: 0; transform: translate(0, 0) rotate(0deg); }
    8%   { opacity: .8; }
    92%  { opacity: .6; }
    100% { opacity: 0; transform: translate(-8vw, 112vh) rotate(-300deg); }
  }
</style>
</head>

<script>

const petals = document.getElementById('petals');
const N = 12;
for (let i = 0; i < N; i++) {
  const p = document.createElement('div');
  p.className = 'petal';
  const left = Math.random() * 100;
  const size = 9 + Math.random() * 10;
  const dur = 9 + Math.random() * 7;
  const delay = 1.8 + Math.random() * 10;
  const variant = Math.random() < 0.5 ? 'petal-fall-a' : 'petal-fall-b';
  p.style.left = left + 'vw';
  p.style.width = size + 'px';
  p.style.height = size + 'px';
  p.style.animationName = variant;
  p.style.animationDuration = dur + 's';
  p.style.animationDelay = delay + 's';
  petals.appendChild(p);
}
</script>
