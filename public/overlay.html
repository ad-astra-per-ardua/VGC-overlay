<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>

    :root {

      --bg-0: #000000;
      --bg-1: #0A0806;
      --gold: #E9C78C;
      --gold-dim: #C9A468;
      --cream: #FAECD3;
      --card: #14100C;
      --card-edge: #E9C78C;
      --brush: #000000;
      --brush-edge: #E9C78C;
      --ink: #FAECD3;
      --blue: #2E6BE0;
      --red: #D93A2B;
      --bar-left-dark: #1B47B4;
      --bar-left-lit: #46A8F0;
      --bar-right-lit: #F0553C;
      --bar-right-dark: #B02218;
      --pill: #3A322A;

      --diff-nov: #5A55C8;
      --diff-adv: #D8A33C;
      --diff-exh: #D93A2B;
      --diff-mxm: #8C8C8C;
      --diff-inf: #B44FC0;
      --diff-grv: #D4622A;
      --diff-hvn: #3F8FD4;
      --diff-vvd: #D9407A;
      --diff-xcd: #3A9E8C;

      --font-display: "Josefin Sans", "Pretendard", sans-serif;
      --font-accent: "Amatic SC", "Josefin Sans", sans-serif;
      --font-body: "NEXON Lv2 Gothic", "Pretendard", "Noto Sans KR",
      "Malgun Gothic", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg-0);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: absolute;
      top: 50%; left: 50%;
      width: 1920px; height: 1080px;
      transform-origin: center center;
      background:
              radial-gradient(ellipse 1500px 950px at 50% -12%, rgba(233, 199, 140, 0.20), transparent 64%),
              radial-gradient(ellipse 1200px 800px at 10% 108%, rgba(201, 164, 104, 0.13), transparent 60%),
              radial-gradient(ellipse 1200px 800px at 90% 108%, rgba(201, 164, 104, 0.13), transparent 60%),
              linear-gradient(163deg, #1E1810 0%, #0E0B07 46%, #060504 100%);
      overflow: hidden;
    }

    /* 옅은 대각 질감 — 순검정의 밋밋함을 덜어줍니다 */
    #stage::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
              117deg,
              rgba(233, 199, 140, 0.028) 0px,
              rgba(233, 199, 140, 0.028) 1px,
              transparent 1px,
              transparent 10px
      );
      pointer-events: none;
      z-index: 0;
    }

    /* 상·하단 골드 헤어라인 */
    #stage::after {
      content: '';
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
              linear-gradient(90deg, transparent 0%, rgba(233,199,140,.55) 16%, rgba(233,199,140,.55) 84%, transparent 100%) top /100% 2px no-repeat,
              linear-gradient(90deg, transparent 0%, rgba(233,199,140,.38) 20%, rgba(233,199,140,.38) 80%, transparent 100%) bottom /100% 2px no-repeat;
    }

    .bg-deco {
      position: absolute; inset: 0;
      background: url("/assets/bg.png") center / cover no-repeat;
      opacity: .5;
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 0;
    }

    /* 매화 꽃잎 — 배경에 은은하게 휘날림 */
    .petals {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .petal {
      position: absolute;
      top: -40px;
      width: 16px; height: 15px;
      background: radial-gradient(circle at 32% 30%, #F3B7C4 0%, #E38FA4 42%, #C4677E 100%);
      border-radius: 62% 38% 58% 42% / 58% 62% 38% 42%;
      opacity: 0;
      box-shadow: 0 0 5px rgba(227, 143, 164, .32);
      animation: petal-fall linear infinite;
      will-change: transform, opacity;
    }
    @keyframes petal-fall {
      0%   { opacity: 0;   transform: translate3d(0, -40px, 0) rotate(0deg); }
      8%   { opacity: .7; }
      50%  { transform: translate3d(58px, 560px, 0) rotate(220deg); }
      88%  { opacity: .55; }
      100% { opacity: 0;   transform: translate3d(-26px, 1140px, 0) rotate(430deg); }
    }
    @keyframes petal-fall-alt {
      0%   { opacity: 0;   transform: translate3d(0, -40px, 0) rotate(0deg); }
      8%   { opacity: .6; }
      50%  { transform: translate3d(-64px, 560px, 0) rotate(-190deg); }
      88%  { opacity: .48; }
      100% { opacity: 0;   transform: translate3d(34px, 1140px, 0) rotate(-380deg); }
    }

    .petal:nth-child(1)  { left:  6%; width: 15px; height: 14px; animation-duration: 17s; animation-delay: 0s; }
    .petal:nth-child(2)  { left: 14%; width: 11px; height: 10px; animation-duration: 22s; animation-delay: -6s;  animation-name: petal-fall-alt; }
    .petal:nth-child(3)  { left: 23%; width: 17px; height: 16px; animation-duration: 19s; animation-delay: -11s; }
    .petal:nth-child(4)  { left: 31%; width: 12px; height: 12px; animation-duration: 24s; animation-delay: -3s;  animation-name: petal-fall-alt; }
    .petal:nth-child(5)  { left: 40%; width: 15px; height: 14px; animation-duration: 20s; animation-delay: -15s; }
    .petal:nth-child(6)  { left: 48%; width: 10px; height: 10px; animation-duration: 26s; animation-delay: -9s;  animation-name: petal-fall-alt; }
    .petal:nth-child(7)  { left: 57%; width: 13px; height: 13px; animation-duration: 18s; animation-delay: -20s; }
    .petal:nth-child(8)  { left: 65%; width: 16px; height: 15px; animation-duration: 23s; animation-delay: -13s; animation-name: petal-fall-alt; }
    .petal:nth-child(9)  { left: 73%; width: 11px; height: 11px; animation-duration: 21s; animation-delay: -4s; }
    .petal:nth-child(10) { left: 82%; width: 14px; height: 13px; animation-duration: 25s; animation-delay: -18s; animation-name: petal-fall-alt; }
    .petal:nth-child(11) { left: 89%; width: 12px; height: 11px; animation-duration: 19s; animation-delay: -8s; }
    .petal:nth-child(12) { left: 96%; width: 16px; height: 15px; animation-duration: 27s; animation-delay: -23s; animation-name: petal-fall-alt; }

    @media (prefers-reduced-motion: reduce) {
      .petal { animation: none; opacity: 0; }
    }

    .view { position: absolute; inset: 0; display: none; z-index: 2; }
    .view.active { display: block; }

    .topbar {
      position: absolute; top: 40px; left: 0; right: 0;
      height: 150px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 56px;
    }
    .side { display: flex; align-items: center; gap: 22px; }

    .team-brush {
      background: var(--brush);
      padding: 12px 40px;
      clip-path: polygon(4% 0%, 96% 0%, 100% 100%, 0% 100%);
      box-shadow: inset 0 0 0 2px var(--brush-edge);
      display: flex; align-items: center;
    }
    .team-name {
      color: var(--gold);
      font-family: var(--font-display);
      font-size: 34px; font-weight: 700; letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .team-logo {
      width: 162px; height: 162px;
      border: 3px solid var(--gold); border-radius: 4px;
      background: #0A0806 center / cover no-repeat;
      flex: none;
    }
    .team-logo.sm { width: 124px; height: 124px; border-width: 3px; }

    .team-score {
      color: var(--cream);
      font-family: var(--font-display);
      font-size: 62px; font-weight: 700; line-height: 1;
      min-width: 72px; text-align: center;
    }

    .picks {
      position: absolute; top: 320px; left: 0; right: 0; bottom: 60px;
      display: grid; grid-template-columns: 1fr 340px 1fr;
      gap: 0 24px; padding: 0 60px;
      align-items: start;
    }
    .pick-col { list-style: none; display: flex; flex-direction: column; gap: 26px; }

    .picks[data-layout="duo"] .pick-col { gap: 40px; justify-content: center; height: 100%; }
    .picks[data-layout="duo"] .pick { height: 260px; }
    .picks[data-layout="duo"] .pick .jacket { width: 210px; height: 210px; }
    .picks[data-layout="duo"] .pick .song-title { font-size: 46px; }
    .picks[data-layout="duo"] .pick .badge { left: 252px; bottom: 34px; height: 46px; font-size: 28px; }

    .picks[data-layout="penta"] {

      align-items: stretch;
    }
    .picks[data-layout="penta"] .pick-col {
      position: relative; display: block; gap: 0;
      height: 100%; min-height: 700px;
    }
    .picks[data-layout="penta"] .pick {
      position: absolute;
      width: 220px; height: 220px;
      padding: 12px; gap: 8px;
      flex-direction: column; align-items: center;

      margin-left: -110px; margin-top: -110px;
    }
    .picks[data-layout="penta"] .pick .jacket { width: 104px; height: 104px; }
    .picks[data-layout="penta"] .pick .meta {
      padding-top: 0; flex: 1; width: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    }
    .picks[data-layout="penta"] .pick .song-title {
      font-size: 18px; line-height: 1.2; text-align: center;
      -webkit-line-clamp: 2;
    }

    .picks[data-layout="penta"] .pick .badge {
      position: static;
      left: auto; bottom: auto;
      align-self: center;
      margin-top: 6px;
      height: 24px; padding: 0 10px; font-size: 14px;
    }
    .picks[data-layout="penta"] .pick::after { display: none; }

    .picks[data-layout="penta"] .pick:nth-child(1) { left: 50%;   top: 20%; }
    .picks[data-layout="penta"] .pick:nth-child(2) { left: 83.3%; top: 40.7%; }
    .picks[data-layout="penta"] .pick:nth-child(3) { left: 70.6%; top: 74.3%; }
    .picks[data-layout="penta"] .pick:nth-child(4) { left: 29.4%; top: 74.3%; }
    .picks[data-layout="penta"] .pick:nth-child(5) { left: 16.7%; top: 40.7%; }

    .picks[data-layout="penta"] .ban-mark .word { font-size: 26px; padding: 3px 12px; border-width: 1px; }
    .picks[data-layout="penta"] .scope .ring { width: 92px; height: 92px; }
    .picks[data-layout="penta"] .scope .lock { font-size: 17px; padding: 2px 9px; }

    .pick {
      position: relative;
      display: flex; align-items: flex-start; gap: 26px;
      height: 200px; padding: 16px;
      background: var(--card);
      border: 2px solid var(--card-edge);
      border-radius: 8px;
      overflow: hidden;
      animation: pick-in .45s cubic-bezier(.2, .8, .3, 1) both;

      contain: layout style;
    }
    .pick::after {
      content: "";
      position: absolute; right: -30%; top: -60%;
      width: 70%; height: 220%;
      background: linear-gradient(100deg, transparent 42%, rgba(233, 199, 140, .10) 50%, transparent 58%);
      border-radius: 50%;
      pointer-events: none;
    }
    @keyframes pick-in {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to   { opacity: 1; transform: none; }
    }

    .pick .jacket {
      width: 160px; height: 160px; flex: none;
      border: 2px solid var(--gold-dim); border-radius: 4px;
      background: #1A1512 center / cover no-repeat;
    }
    .pick .meta { flex: 1; min-width: 0; position: relative; z-index: 1; padding-top: 4px; }
    .pick .song-title {
      color: var(--cream);
      font-size: 40px; font-weight: 700; line-height: 1.18;
      letter-spacing: -0.01em;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pick .badge {
      position: absolute; left: 202px; bottom: 26px;
      display: inline-flex; align-items: center;
      height: 40px; padding: 0 18px;
      border-radius: 4px;
      background: var(--pill);
      border: 1px solid rgba(233, 199, 140, .35);
      color: var(--gold); font-size: 25px; font-weight: 700; letter-spacing: .02em;
      z-index: 2;
    }
    .pick .str-tag {
      display: none;
      position: absolute; top: 10px; right: 10px;
      height: 26px; padding: 0 10px;
      align-items: center;
      border-radius: 3px;
      background: #2A0D0A;
      border: 1px solid var(--red);
      color: var(--cream);
      font-family: var(--font-display);
      font-size: 15px; font-weight: 700; letter-spacing: .06em;
      z-index: 3;
    }
    .pick.str-picked .str-tag { display: inline-flex; }

    .pick.banned { overflow: visible; z-index: 3; contain: none; }

    .pick.banned .jacket,
    .pick.banned .meta { filter: grayscale(.6) brightness(.72); }

    .ban-mark {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      pointer-events: none; z-index: 5;
      overflow: hidden;
      border-radius: 6px;
    }

    /* 파편·꽃잎은 카드 밖으로 튀어야 해서 별도 레이어 */
    .ban-burst {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 9;
      overflow: visible;
    }

    /* 칼날 궤적 — 사선으로 베고 지나감 */
    .ban-mark .cut-line {
      position: absolute; left: -8%; right: -8%; top: 50%;
      height: 4px;
      transform: translateY(-50%) rotate(-13deg);
      transform-origin: center center;
      background: linear-gradient(90deg,
      transparent 0%,
      var(--red) 8%,
      #FF8A72 46%,
      #FFFFFF 62%,
      #FFE9C9 74%,
      var(--red) 88%,
      transparent 100%);
      box-shadow:
              0 0 18px 2px rgba(217, 58, 43, .75),
              0 0 42px 6px rgba(217, 58, 43, .35);
      animation: cut-sweep .19s cubic-bezier(.85, 0, .15, 1) forwards;
      filter: blur(.2px);
      z-index: 7;
    }
    @keyframes cut-sweep {
      0%   { clip-path: inset(-30px 100% -30px -30px); opacity: 1; }
      62%  { opacity: 1; }
      100% { clip-path: inset(-30px -30px -30px -30px); opacity: 0; }
    }

    /* 베인 흉터 — 카드에 그대로 남음 */
    .ban-mark .scar {
      position: absolute; left: -8%; right: -8%; top: 50%;
      height: 3px;
      transform: translateY(-50%) rotate(-13deg);
      transform-origin: center center;
      background: linear-gradient(90deg,
      transparent 0%,
      rgba(217,58,43,.95) 10%,
      rgba(255,138,114,1) 50%,
      rgba(217,58,43,.95) 90%,
      transparent 100%);
      box-shadow:
              0 0 10px rgba(217,58,43,.7),
              0 1px 0 rgba(0,0,0,.85),
              0 -1px 0 rgba(0,0,0,.85);
      animation: scar-appear .26s cubic-bezier(.85, 0, .15, 1) .06s forwards;
      z-index: 6;
    }
    @keyframes scar-appear {
      0%   { clip-path: inset(-30px 100% -30px -30px); opacity: 0; }
      35%  { opacity: 1; }
      100% { clip-path: inset(-30px -30px -30px -30px); opacity: 1; }
    }

    /* 갈라진 틈 — 흉터 아래로 어둡게 벌어진 느낌 */
    .ban-mark .rift {
      position: absolute; left: -8%; right: -8%; top: 50%;
      height: 16px;
      transform: translateY(-50%) rotate(-13deg);
      transform-origin: center center;
      background: linear-gradient(180deg,
      transparent 0%,
      rgba(0,0,0,.75) 38%,
      rgba(0,0,0,.9) 50%,
      rgba(0,0,0,.75) 62%,
      transparent 100%);
      animation: scar-appear .3s cubic-bezier(.85, 0, .15, 1) .07s forwards;
      z-index: 5;
    }

    /* 잘린 위·아래 조각이 서로 어긋남 */
    .pick.banned .jacket {
      animation: slash-shift .55s cubic-bezier(.2, .9, .3, 1) .16s both;
    }
    @keyframes slash-shift {
      0%   { transform: translate(0, 0); }
      20%  { transform: translate(6px, -5px); }
      52%  { transform: translate(-3px, 2px); }
      100% { transform: translate(0, 0); }
    }
    .pick.banned .meta {
      animation: slash-shift-alt .55s cubic-bezier(.2, .9, .3, 1) .16s both;
    }
    @keyframes slash-shift-alt {
      0%   { transform: translate(0, 0); }
      20%  { transform: translate(-5px, 5px); }
      52%  { transform: translate(2px, -2px); }
      100% { transform: translate(0, 0); }
    }

    /* 베는 순간 섬광 */
    .ban-mark .flash {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 70% 40% at 50% 50%, rgba(255,240,220,.85), rgba(217,58,43,.25) 45%, transparent 72%);
      opacity: 0;
      animation: ban-flash .34s ease-out .1s forwards;
      mix-blend-mode: screen;
    }
    @keyframes ban-flash {
      0%   { opacity: 0; transform: scale(.7); }
      18%  { opacity: 1; transform: scale(1.04); }
      100% { opacity: 0; transform: scale(1.18); }
    }

    /* 파편 */
    .ban-burst .shard {
      position: absolute; left: 50%; top: 50%;
      width: 9px; height: 3px;
      background: linear-gradient(90deg, #FFE9C9, var(--red));
      box-shadow: 0 0 7px rgba(217,58,43,.8);
      opacity: 0;
      animation: shard-fly .68s cubic-bezier(.15, .75, .35, 1) .14s forwards;
    }
    @keyframes shard-fly {
      0%   { opacity: 0;  transform: translate(-50%, -50%) rotate(var(--sr, 0deg)) translateX(0) scale(1); }
      12%  { opacity: 1; }
      100% { opacity: 0;  transform: translate(-50%, -50%) rotate(var(--sr, 0deg)) translateX(var(--sd, 120px)) scale(.35); }
    }
    .ban-burst .shard:nth-of-type(1) { --sr: -24deg;  --sd: 92px; animation-delay: .14s; }
    .ban-burst .shard:nth-of-type(2) { --sr: 158deg;  --sd: 84px; animation-delay: .15s; height: 2px; width: 13px; }
    .ban-burst .shard:nth-of-type(3) { --sr: -52deg;  --sd: 68px; animation-delay: .17s; width: 7px; }
    .ban-burst .shard:nth-of-type(4) { --sr: 132deg;  --sd: 62px; animation-delay: .16s; }
    .ban-burst .shard:nth-of-type(5) { --sr: -8deg;   --sd: 104px; animation-delay: .19s; height: 2px; }
    .ban-burst .shard:nth-of-type(6) { --sr: 178deg;  --sd: 74px; animation-delay: .18s; width: 11px; }
    .ban-burst .shard:nth-of-type(7) { --sr: -38deg;  --sd: 58px;  animation-delay: .21s; width: 6px; height: 2px; }
    .ban-burst .shard:nth-of-type(8) { --sr: 146deg;  --sd: 96px;  animation-delay: .2s;  width: 8px; }

    /* 흩날리는 매화 꽃잎 */
    .ban-burst .ban-petal {
      position: absolute; left: 50%; top: 50%;
      width: 13px; height: 12px;
      background: radial-gradient(circle at 32% 30%, #F7C6D2 0%, #E38FA4 44%, #C4677E 100%);
      border-radius: 62% 38% 58% 42% / 58% 62% 38% 42%;
      box-shadow: 0 0 8px rgba(227,143,164,.6);
      opacity: 0;
      animation: ban-petal-burst 1.05s cubic-bezier(.12, .7, .3, 1) .18s forwards;
    }
    @keyframes ban-petal-burst {
      0%   { opacity: 0; transform: translate(-50%, -50%) rotate(var(--pr, 0deg)) translateX(0) rotate(0deg) scale(.5); }
      14%  { opacity: 1; }
      70%  { opacity: .9; }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--pr, 0deg)) translateX(var(--pd, 130px)) rotate(560deg) scale(1); }
    }
    .ban-burst .ban-petal:nth-of-type(1) { --pr: -34deg; --pd: 96px; animation-delay: .18s; }
    .ban-burst .ban-petal:nth-of-type(2) { --pr: 168deg; --pd: 88px; animation-delay: .22s; width: 10px; height: 9px; }
    .ban-burst .ban-petal:nth-of-type(3) { --pr: -66deg; --pd: 74px; animation-delay: .2s; }
    .ban-burst .ban-petal:nth-of-type(4) { --pr: 124deg; --pd: 102px; animation-delay: .25s; width: 15px; height: 14px; }
    .ban-burst .ban-petal:nth-of-type(5) { --pr: 14deg;  --pd: 82px; animation-delay: .23s; width: 11px; height: 10px; }
    .ban-burst .ban-petal:nth-of-type(6) { --pr: -152deg;--pd: 90px; animation-delay: .27s; }

    .ban-mark .word {
      position: relative; z-index: 8;
      display: inline-flex; align-items: center;
      padding: 6px 22px;
      background: #0A0806;
      border: 2px solid var(--red);
      color: var(--red);
      font-family: var(--font-display);
      font-size: 42px; font-weight: 700; letter-spacing: .12em;
      opacity: 0; transform: scale(1.6);
      box-shadow: 0 0 26px rgba(217, 58, 43, .55), 0 6px 18px rgba(0,0,0,.7);
      animation: ban-word .3s cubic-bezier(.15, 1.3, .35, 1) .2s forwards;
    }
    @keyframes ban-word {
      0%   { opacity: 0; transform: scale(1.6); }
      55%  { opacity: 1; transform: scale(.94); }
      100% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ban-burst .shard, .ban-burst .ban-petal, .ban-mark .flash,
      .ban-mark .cut-line { display: none; }
      .pick.banned .jacket, .pick.banned .meta { animation: none; }
      .ban-mark .scar, .ban-mark .rift { animation: none; clip-path: none; opacity: 1; }
    }

    .pick.str-target {
      animation: str-target-pulse .5s ease-in-out 3;
      z-index: 2;
    }
    @keyframes str-target-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217, 58, 43, 0); }
      50%      { box-shadow: 0 0 0 3px rgba(217, 58, 43, .85); }
    }

    .scope {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 6;
      display: grid; place-items: center;
      overflow: hidden;
    }
    .scope .ring {
      position: absolute;
      width: 150px; height: 150px;
      border: 3px solid var(--red);
      border-radius: 50%;
      opacity: 0;
      transform: scale(3.2) rotate(0deg);
      animation: scope-close .55s cubic-bezier(.5, 0, .2, 1) forwards;
    }
    .scope .ring::after {
      content: "";
      position: absolute; inset: -10px;
      border-radius: 50%;
      background:
              linear-gradient(var(--red), var(--red)) 50% 0   / 2px 12px no-repeat,
              linear-gradient(var(--red), var(--red)) 50% 100% / 2px 12px no-repeat,
              linear-gradient(var(--red), var(--red)) 0   50% / 12px 2px no-repeat,
              linear-gradient(var(--red), var(--red)) 100% 50% / 12px 2px no-repeat;
    }
    @keyframes scope-close {
      0%   { opacity: 0;   transform: scale(3.2) rotate(-90deg); }
      35%  { opacity: 1; }
      100% { opacity: 1;   transform: scale(1) rotate(0deg); }
    }

    .scope .cross-h, .scope .cross-v {
      position: absolute; background: var(--red); opacity: 0;
    }
    .scope .cross-h {
      left: 0; right: 0; height: 2px;
      transform: scaleX(0); transform-origin: center;
      animation: cross-in-h .3s ease-out .42s forwards;
    }
    .scope .cross-v {
      top: 0; bottom: 0; width: 2px;
      transform: scaleY(0); transform-origin: center;
      animation: cross-in-v .3s ease-out .42s forwards;
    }
    @keyframes cross-in-h { to { opacity: .9; transform: scaleX(1); } }
    @keyframes cross-in-v { to { opacity: .9; transform: scaleY(1); } }

    .scope .lock {
      position: relative; z-index: 2;
      font-family: var(--font-display);
      font-size: 30px; font-weight: 700; letter-spacing: .18em;
      color: var(--cream);
      background: #0A0806; border: 2px solid var(--red);
      padding: 4px 16px;
      opacity: 0; transform: scale(.8);
      animation: lock-in .25s cubic-bezier(.2, 1.3, .4, 1) .62s forwards;
    }
    @keyframes lock-in { to { opacity: 1; transform: scale(1); } }

    #str-panel {
      position: absolute; inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, .82);
      animation: str-panel-in .3s ease-out;
    }
    #str-panel.on { display: grid; }
    @keyframes str-panel-in { from { opacity: 0; } to { opacity: 1; } }

    .str-head {
      position: absolute; top: 130px; left: 0; right: 0;
      text-align: center;
      font-family: var(--font-display);
      color: var(--gold);
      font-size: 46px; font-weight: 700; letter-spacing: .2em;
    }
    .str-head small {
      display: block; margin-top: 8px;
      font-size: 22px; letter-spacing: .1em; color: var(--gold-dim);
    }

    .str-cards { display: flex; gap: 34px; perspective: 1800px; }

    .str-card {
      width: 380px; height: 440px;
      position: relative;
      transform-style: preserve-3d;
      animation: str-card-in .45s cubic-bezier(.2, .9, .3, 1) backwards;
    }

    /* 앞·뒷면 공통 */
    .str-card .face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      border-radius: 10px;
      border: 2px solid var(--card-edge);
      background: var(--card);
      box-shadow: 0 10px 34px rgba(0,0,0,.6);
    }

    /* 앞면 — 곡 정보 */
    .str-card .front {
      padding: 22px;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      transform: rotateY(180deg);
    }

    /* 뒷면 — 문양 */
    .str-card .back {
      display: grid; place-items: center;
      background:
              radial-gradient(ellipse 70% 55% at 50% 42%, rgba(233,199,140,.10), transparent 68%),
              linear-gradient(155deg, #1A140D 0%, #0C0906 100%);
      overflow: hidden;
    }
    .str-card .back::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
              38deg,
              rgba(233,199,140,.05) 0px,
              rgba(233,199,140,.05) 1px,
              transparent 1px,
              transparent 13px
      );
    }
    .str-card .back .sigil {
      position: relative;
      width: 152px; height: 152px;
      border: 2px solid var(--gold-dim);
      transform: rotate(45deg);
      display: grid; place-items: center;
      box-shadow: 0 0 26px rgba(233,199,140,.18), inset 0 0 22px rgba(233,199,140,.10);
    }
    .str-card .back .sigil::before {
      content: '';
      position: absolute; inset: 16px;
      border: 1px solid rgba(233,199,140,.45);
    }
    .str-card .back .sigil span {
      transform: rotate(-45deg);
      font-family: var(--font-display);
      font-size: 19px; font-weight: 700; letter-spacing: .16em;
      color: var(--gold);
    }

    /* 카드가 뒤집히는 순간 */
    .str-card.revealed { animation: str-flip .62s cubic-bezier(.42, .05, .2, 1) forwards; }
    @keyframes str-flip {
      0%   { transform: rotateY(0deg)   translateY(0)     scale(1); }
      38%  { transform: rotateY(74deg)  translateY(-26px) scale(1.06); }
      100% { transform: rotateY(180deg) translateY(0)     scale(1); }
    }

    .str-card .jacket {
      width: 300px; height: 300px; flex: none;
      border: 2px solid var(--gold-dim); border-radius: 6px;
      background: #1A1512 center / cover no-repeat;
    }
    .str-card .t {
      color: var(--cream); font-size: 26px; font-weight: 700;
      text-align: center; line-height: 1.2;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .str-card .b {
      display: inline-flex; align-items: center; height: 34px; padding: 0 14px;
      border-radius: 4px; font-size: 21px; font-weight: 700;
    }
    @keyframes str-card-in { from { transform: translateY(40px); opacity: 0; } }

    .str-card.picked .face {
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(233,199,140,.5), 0 0 44px rgba(233,199,140,.35);
    }
    .str-card.picked { animation: str-picked-lift .5s cubic-bezier(.2, 1.2, .4, 1) forwards; }
    @keyframes str-picked-lift {
      0%   { transform: rotateY(180deg) scale(1); }
      100% { transform: rotateY(180deg) scale(1.07); }
    }

    .str-card.dropped {
      animation: str-unflip .55s cubic-bezier(.42, .05, .2, 1) forwards;
      pointer-events: none;
    }
    @keyframes str-unflip {
      0%   { transform: rotateY(180deg) scale(1);   opacity: 1; }
      45%  { transform: rotateY(104deg) scale(.97); opacity: .85; }
      100% { transform: rotateY(0deg)   scale(.88); opacity: 0; }
    }

    /* 사라진 뒤 자리를 접어 선택 카드가 가운데로 */
    .str-card.collapsed {
      width: 0;
      margin-left: -17px; margin-right: -17px;
      transition: width .4s cubic-bezier(.3,.8,.4,1), margin .4s cubic-bezier(.3,.8,.4,1);
    }

    .str-note {
      position: absolute; bottom: 120px; left: 0; right: 0;
      text-align: center;
      font-family: var(--font-display);
      font-size: 30px; font-weight: 700; letter-spacing: .12em;
      color: var(--gold);
      opacity: 0;
    }
    .str-note.on { animation: str-note-in .35s ease-out forwards; }
    @keyframes str-note-in { to { opacity: 1; } }

    .emblem {
      position: relative;
      align-self: center;
      display: grid; place-items: center;
      height: 260px;
    }
    .blossom { width: 260px; height: 260px; }
    .emblem-text {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--cream); text-align: center;
      font-family: var(--font-display);
    }
    .emblem-text .kicker { font-size: 22px; font-weight: 600; letter-spacing: .22em; color: var(--gold-dim); }
    .emblem-text .title  { font-size: 54px; font-weight: 700; letter-spacing: .01em; line-height: 1.05; color: var(--gold); }
    .emblem-text .sub    { font-size: 22px; font-weight: 600; letter-spacing: .26em; color: var(--gold-dim); }

    .matchbar {
      position: absolute; top: 32px; left: 0; right: 0;
      height: 132px;
      display: flex; align-items: center; justify-content: center; gap: 24px;
      padding: 0 48px;
    }

    .team-badge {
      position: absolute; top: 176px;
      min-width: 124px; max-width: 340px;
      height: 44px;
      display: none;
      padding: 0 12px;
      background: #0A0806;
      border: 2px solid var(--gold);
      color: var(--gold);
      font-family: var(--font-display);
      font-size: 14px; font-weight: 700; letter-spacing: .01em;
      white-space: nowrap;
      overflow: hidden;
      z-index: 4;
    }
    .team-badge.on { display: grid; }
    .team-badge .badge-line {
      grid-area: 1 / 1;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      animation: badge-cross 6s ease-in-out infinite;
    }
    .team-badge .badge-line.b2 { animation-delay: 3s; }
    @keyframes badge-cross {
      0%   { opacity: 0; }
      8%   { opacity: 1; }
      42%  { opacity: 1; }
      50%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .team-badge .badge-line { animation: none !important; opacity: 1; }
      .team-badge .badge-line.b2 { display: none; }
    }

    .team-badge.str {
      border-color: var(--red);
      color: var(--cream);
      background: #2A0D0A;
      font-size: 15px; letter-spacing: .01em;
    }
    .team-badge.str .badge-line { animation: none; opacity: 1; }
    .team-badge.str .badge-line.b2 { display: none; }

    #badge-left, #badge-right { left: 0; }

    .hud-banner {
      display: none;

      width: 720px; height: 250px;
      flex: none;
      border: 2px solid var(--card-edge);
      border-radius: 4px;
      background: #000;
      box-shadow:
              0 0 20px rgba(233, 199, 140, .15),
              0 0 52px rgba(233, 199, 140, .06),
              0 14px 34px rgba(0,0,0,.5);
    }
    .hud-banner.on { display: block; }

    .matchbar.has-hud { height: 260px; }

    .pill-score {
      min-width: 120px; height: 84px;
      display: grid; place-items: center;
      background: var(--brush);
      box-shadow: inset 0 0 0 2px var(--brush-edge);
      color: var(--gold); font-family: var(--font-display); font-size: 56px; font-weight: 700;
      clip-path: polygon(4% 12%, 96% 4%, 100% 88%, 2% 96%);
      padding: 0 18px;
    }
    .meter {
      position: relative;
      flex: 1; max-width: 1140px; height: 66px;
      background: rgba(233, 199, 140, .08);
      border: 1px solid rgba(233, 199, 140, .25);
      border-radius: 4px;
      overflow: visible;
    }
    .meter::after {
      content: "";
      position: absolute; left: 50%; top: -6px; bottom: -6px;
      width: 2px; margin-left: -1px;
      background: rgba(233, 199, 140, .9);
      box-shadow: 0 0 4px rgba(233, 199, 140, .6);
      z-index: 2;
      pointer-events: none;
    }
    .meter-fill-left, .meter-fill-right {
      position: absolute; top: 0; bottom: 0;

      width: 100%;
      transition: transform .25s cubic-bezier(.25, .1, .25, 1);
      will-change: transform;
    }
    .meter-fill-left  { left: 0;  transform-origin: left center;  transform: scaleX(.5);
      background: linear-gradient(90deg, var(--bar-left-dark), var(--bar-left-lit)); border-radius: 4px 0 0 4px; }
    .meter-fill-right { right: 0; transform-origin: right center; transform: scaleX(.5);
      background: linear-gradient(90deg, var(--bar-right-lit), var(--bar-right-dark)); border-radius: 0 4px 4px 0; }

    .meter-knob {
      position: absolute; top: -30px; bottom: -8px;
      left: 0;
      width: 0;
      display: flex; justify-content: center;
      transition: transform .25s cubic-bezier(.25, .1, .25, 1);
      z-index: 3;
      will-change: transform;
    }
    .meter-knob::before {
      content: ""; position: absolute; top: 34px; bottom: 0;
      width: 3px; background: var(--gold);
    }
    .meter-knob span {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 118px; height: 44px; padding: 0 16px;
      background: var(--brush); color: var(--gold);
      box-shadow: inset 0 0 0 2px var(--brush-edge);
      font-family: var(--font-display);
      font-size: 28px; font-weight: 700; white-space: nowrap;
      clip-path: polygon(6% 8%, 94% 2%, 100% 78%, 50% 100%, 0 76%);
    }
    .meter-knob span:empty { display: none; }

    .meter-knob span { transition: background-color .3s ease, color .3s ease; }
    .meter-knob.lead-left  span { background: var(--bar-left-dark); color: #fff; box-shadow: none; }
    .meter-knob.lead-right span { background: var(--bar-right-dark); color: #fff; box-shadow: none; }

    .meter-knob.flip span { animation: lead-flip .5s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes lead-flip {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.28); }
      100% { transform: scale(1); }
    }

    .feeds {
      position: absolute; top: 244px; left: 28px; right: 28px; bottom: 40px;
      display: grid; gap: 12px;

      grid-template-columns: repeat(var(--feed-cols, 4), 1fr);
    }

    .feeds.has-hud {
      grid-template-columns: repeat(2, 476px);   /* 591 * (366/540) ≈ 400 */
      justify-content: center;
      gap: 106px;
      bottom: 90px;
    }
    .feeds.has-hud .feed .frame {
      height: 701px; flex: none;
    }
    .feeds.has-hud .feed .rank {
      display: none;
    }

    .feeds[data-cols="2"]:not(.has-hud) {
      grid-template-columns: repeat(2, 457px);
      justify-content: center;
      gap: 90px;
    }
    .feeds[data-cols="2"]:not(.has-hud) .feed .frame {
      flex: 1;
    }
    .feed { position: relative; display: flex; flex-direction: column; contain: layout style; }
    .feed .rank {
      height: 56px; margin: 0 6px;
      display: grid; place-items: center;
      background: var(--brush);
      box-shadow: inset 0 0 0 2px var(--brush-edge);
      color: var(--gold); font-family: var(--font-display);
      font-size: 40px; font-weight: 700; letter-spacing: .02em;
      clip-path: polygon(3% 10%, 97% 2%, 100% 92%, 1% 100%);
    }

    .feed .rank.bump { animation: rank-bump .45s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes rank-bump {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.22); }
      100% { transform: scale(1); }
    }
    .feed .frame {
      position: relative; flex: 1;
      border: 3px solid var(--card-edge);
      border-radius: 4px;
      background: #000;
      overflow: hidden;
      box-shadow:
              0 0 0 1px rgba(0,0,0,.9),
              0 0 30px rgba(233, 199, 140, .30),
              0 0 80px rgba(233, 199, 140, .14),
              0 18px 46px rgba(0,0,0,.6);
    }

    /* 화면 안쪽 얇은 골드 라인 + 살짝의 비네팅 */
    .feed .frame::after {
      content: '';
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 3;
      box-shadow:
              inset 0 0 0 1px rgba(233, 199, 140, .30),
              inset 0 0 46px rgba(0, 0, 0, .40);
      border-radius: 2px;
    }

    /* 프레임 네 모서리 골드 브래킷 (안쪽에 그려 잘리지 않게) */
    .feed .frame::before {
      content: '';
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 4;
      background:
              linear-gradient(var(--gold), var(--gold)) 0 0 / 26px 3px no-repeat,
              linear-gradient(var(--gold), var(--gold)) 0 0 / 3px 26px no-repeat,
              linear-gradient(var(--gold), var(--gold)) 100% 0 / 26px 3px no-repeat,
              linear-gradient(var(--gold), var(--gold)) 100% 0 / 3px 26px no-repeat,
              linear-gradient(var(--gold), var(--gold)) 0 100% / 26px 3px no-repeat,
              linear-gradient(var(--gold), var(--gold)) 0 100% / 3px 26px no-repeat,
              linear-gradient(var(--gold), var(--gold)) 100% 100% / 26px 3px no-repeat,
              linear-gradient(var(--gold), var(--gold)) 100% 100% / 3px 26px no-repeat;
      filter: drop-shadow(0 0 6px rgba(233, 199, 140, .8));
    }
    .feed video, .feed .placeholder {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .feed .placeholder {
      display: grid; place-items: center;
      color: rgba(233, 199, 140, .3);
      font-family: var(--font-display);
      font-size: 22px; font-weight: 600; letter-spacing: .1em;
      background: repeating-linear-gradient(45deg, #0A0806 0 14px, #120E09 14px 28px);
    }

    .feed .plate {
      height: 82px; flex: none;
      display: flex; align-items: center; gap: 14px;
      padding-left: 8px;
      z-index: 2;
    }
    .feed .plate .avatar {
      width: 66px; height: 66px; flex: none;
      border-radius: 50%; border: 2px solid var(--gold);
      background: #1A1512 center / cover no-repeat;
      box-shadow:
              0 0 12px rgba(233, 199, 140, .25),
              inset 0 0 10px rgba(0,0,0,.6);
    }
    .feed .plate .brush {
      flex: 1; min-width: 0; height: 58px;
      display: flex; align-items: center;
      padding: 0 18px;
      background: var(--brush);
      box-shadow: inset 0 0 0 1px rgba(233, 199, 140, .3);
      clip-path: polygon(3% 0, 97% 0, 100% 100%, 0 100%);
    }
    .feed .plate .brush span {
      color: var(--cream); font-size: 30px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .feed[data-team="left"]  .plate .brush { box-shadow: inset 0 0 0 1px var(--bar-left-lit); }
    .feed[data-team="right"] .plate .brush { box-shadow: inset 0 0 0 1px var(--bar-right-lit); }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

  </style>
</head>
<body>
<div id="stage">

  <div class="bg-deco" aria-hidden="true"></div>
  <div class="petals" aria-hidden="true">
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
    <span class="petal"></span>
  </div>

  <!-- STRATEGY 후보 3장 패널 (선곡 뷰 위에 겹쳐 뜸) -->
  <div id="str-panel">
    <div class="str-head">STRATEGY<small id="str-sub"></small></div>
    <div class="str-cards" id="str-cards"></div>
    <div class="str-note" id="str-note"></div>
  </div>

  <!-- 선곡 / 밴 공용 뷰 -->
  <section class="view" data-view="songs">
    <header class="topbar">
      <div class="side left">
        <div class="team-brush"><span class="team-name" data-bind="teams.left.name"></span></div>
        <div class="team-logo" data-bind-bg="teams.left.logo"></div>
        <div class="team-score" data-bind="teams.left.score"></div>
      </div>
      <div class="side right">
        <div class="team-score" data-bind="teams.right.score"></div>
        <div class="team-logo" data-bind-bg="teams.right.logo"></div>
        <div class="team-brush"><span class="team-name" data-bind="teams.right.name"></span></div>
      </div>
    </header>

    <div class="picks">
      <ul class="pick-col" id="picks-left"></ul>

      <div class="emblem">
        <svg viewBox="0 0 220 220" class="blossom" aria-hidden="true">
          <g fill="none" stroke="#E9C78C">
            <rect x="30" y="30" width="160" height="160" transform="rotate(45 110 110)" stroke-width="2.5"/>
            <rect x="52" y="52" width="116" height="116" transform="rotate(45 110 110)" stroke-width="1.5" opacity=".55"/>
          </g>
          <g fill="#E9C78C">
            <rect x="106" y="6" width="8" height="8" transform="rotate(45 110 10)"/>
            <rect x="106" y="206" width="8" height="8" transform="rotate(45 110 210)"/>
            <rect x="6" y="106" width="8" height="8" transform="rotate(45 10 110)"/>
            <rect x="206" y="106" width="8" height="8" transform="rotate(45 210 110)"/>
          </g>
        </svg>
        <div class="emblem-text">
          <span class="kicker" data-bind="round.kicker"></span>
          <span class="title" data-bind="round.title"></span>
          <span class="sub" data-bind="round.sub"></span>
        </div>
      </div>

      <ul class="pick-col" id="picks-right"></ul>
    </div>
  </section>

  <!-- 경기중 뷰 -->
  <section class="view" data-view="match">
    <header class="matchbar">
      <div class="team-badge" id="badge-left"></div>
      <div class="team-badge" id="badge-right"></div>
      <div class="team-logo sm" data-bind-bg="teams.left.logo"></div>
      <div class="pill-score left" data-bind="teams.left.score"></div>
      <div class="meter" id="meter">
        <div class="meter-fill-left" id="meter-left"></div>
        <div class="meter-fill-right" id="meter-right"></div>
        <div class="meter-knob" id="meter-knob"><span id="meter-label"></span></div>
      </div>
      <canvas class="hud-banner" id="hud-banner"></canvas>
      <div class="pill-score right" data-bind="teams.right.score"></div>
      <div class="team-logo sm" data-bind-bg="teams.right.logo"></div>
    </header>

    <div class="feeds" id="feeds"></div>
  </section>

</div>
<script>
  'use strict';

  const stage = document.getElementById('stage');
  let state = null;

  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener('resize', fit);
  fit();

  const normView = (v) => (v === 'select' || v === 'ban') ? 'songs' : (v || 'songs');

  const get = (obj, dotPath) => dotPath.split('.').reduce((a, k) => (a == null ? a : a[k]), obj);

  const DIFF_VAR = {
    NOV: '--diff-nov', ADV: '--diff-adv', EXH: '--diff-exh', MXM: '--diff-mxm',
    INF: '--diff-inf', GRV: '--diff-grv', HVN: '--diff-hvn', VVD: '--diff-vvd', XCD: '--diff-xcd'
  };

  function applyBindings() {
    document.querySelectorAll('[data-bind]').forEach((el) => {
      const v = get(state, el.dataset.bind);
      el.textContent = v == null ? '' : String(v);
    });
    document.querySelectorAll('[data-bind-bg]').forEach((el) => {
      const v = get(state, el.dataset.bindBg);
      el.style.backgroundImage = v ? `url("${v}")` : '';
    });
  }

  const pickCache = { left: '', right: '' };

  function makePick() {
    const li = document.createElement('li');
    li.className = 'pick';
    li.innerHTML = '<div class="jacket"></div>'
            + '<div class="meta"><div class="song-title"></div></div>'
            + '<div class="badge"></div>'
            + '<div class="str-tag">STRATEGY</div>';
    return li;
  }

  function updatePick(li, song, i, animate) {
    const jacket = li.querySelector('.jacket');
    const bg = song.jacket ? `url("${song.jacket}")` : '';
    if (jacket.style.backgroundImage !== bg) jacket.style.backgroundImage = bg;

    const title = li.querySelector('.song-title');
    const titleText = song.title || '';
    if (title.textContent !== titleText) title.textContent = titleText;

    const badge = li.querySelector('.badge');
    const badgeText = `${song.diff || ''} ${song.level || ''}`.trim();
    if (badge.textContent !== badgeText) badge.textContent = badgeText;
    const varName = DIFF_VAR[(song.diff || '').toUpperCase()];
    badge.style.background = varName ? `var(${varName})` : '';

    badge.style.color = varName ? '#000' : 'var(--gold)';

    li.classList.toggle('banned', !!song.banned);
    li.classList.toggle('str-picked', !!song.strategyPick);

    const wantMark = !!song.banned;
    const mark = li.querySelector('.ban-mark');
    if (wantMark && !mark) {
      const el = document.createElement('div');
      el.className = 'ban-mark';
      el.innerHTML =
              '<div class="flash"></div>' +
              '<div class="rift"></div>' +
              '<div class="scar"></div>' +
              '<div class="cut-line"></div>' +
              '<div class="word">BANNED</div>';
      const burst = document.createElement('div');
      burst.className = 'ban-burst';
      burst.innerHTML =
              '<i class="shard"></i><i class="shard"></i><i class="shard"></i><i class="shard"></i>' +
              '<i class="shard"></i><i class="shard"></i><i class="shard"></i><i class="shard"></i>' +
              '<b class="ban-petal"></b><b class="ban-petal"></b><b class="ban-petal"></b>' +
              '<b class="ban-petal"></b><b class="ban-petal"></b><b class="ban-petal"></b>';
      li.appendChild(el);
      li.appendChild(burst);
    } else if (!wantMark && mark) {
      mark.remove();
      const b = li.querySelector('.ban-burst');
      if (b) b.remove();
    }

    if (animate) {
      li.style.animation = 'none';
      void li.offsetWidth;
      li.style.animation = '';
      li.style.animationDelay = `${i * 0.09}s`;
    }
  }

  let strSig = '';

  function renderStrategy() {
    const st = state.strategy || {};
    const act = st.active;
    const panel = document.getElementById('str-panel');

    document.querySelectorAll('.pick.str-target').forEach((el) => {
      el.classList.remove('str-target');
      const s = el.querySelector('.scope');
      if (s) s.remove();
    });

    if (!act) {
      panel.classList.remove('on');
      strSig = '';
      return;
    }

    const sig = `${act.side}|${act.index}|${act.phase}|${act.choice}`;
    const changed = sig !== strSig;
    strSig = sig;

    if (act.phase === 'aim') {
      panel.classList.remove('on');
      const ul = document.getElementById(`picks-${act.side}`);
      const li = ul && ul.children[act.index];
      if (li && changed) {
        li.classList.add('str-target');
        const sc = document.createElement('div');
        sc.className = 'scope';
        sc.innerHTML = '<div class="ring"></div><div class="cross-h"></div>' +
                '<div class="cross-v"></div><div class="lock">STRATEGY</div>';
        li.appendChild(sc);
      } else if (li) {
        li.classList.add('str-target');
      }
      return;
    }

    panel.classList.add('on');
    const target = asArray(state.songs && state.songs[act.side])[act.index] || {};
    document.getElementById('str-sub').textContent =
            target.title ? `STRATEGY 대상 — ${target.title}` : '';

    const wrap = document.getElementById('str-cards');
    const attacker = act.side === 'left' ? 'right' : 'left';
    const pool = asArray(
            (st.pools && st.pools[attacker]) ||
            st.pool
    );
    if (changed || wrap.children.length !== pool.length) {
      wrap.innerHTML = '';
      pool.forEach((song, i) => {
        const c = document.createElement('div');
        c.className = 'str-card';
        c.style.animationDelay = `${i * 0.1}s`;
        const varName = DIFF_VAR[(song.diff || '').toUpperCase()];
        c.innerHTML =
                '<div class="face back"><div class="sigil"><span>STRATEGY</span></div></div>' +
                '<div class="face front">' +
                `<div class="jacket"${song.jacket ? ` style="background-image:url('${song.jacket}')"` : ''}></div>` +
                `<div class="t">${escapeHtml(song.title || '')}</div>` +
                `<div class="b" style="background:${varName ? `var(${varName})` : 'var(--pill)'};` +
                `color:${varName ? '#000' : 'var(--gold)'}">` +
                `${escapeHtml(`${song.diff || ''} ${song.level || ''}`.trim())}</div>` +
                '</div>';
        wrap.appendChild(c);
      });
    }

    const note = document.getElementById('str-note');
    if (act.phase === 'cards') {
      [...wrap.children].forEach((c) => {
        c.classList.remove('picked', 'dropped', 'collapsed');
        if (changed) {
          c.classList.remove('revealed');
          void c.offsetWidth;
        }
        c.style.animationDelay = '0s';
        c.classList.add('revealed');
      });
      note.className = 'str-note';
      note.textContent = '';
    } else if (act.phase === 'result') {
      [...wrap.children].forEach((c) => {
        c.classList.remove('collapsed');
        if (!c.classList.contains('revealed')) {
          c.style.animationDelay = '0s';
          c.classList.add('revealed');
        }
      });

      [...wrap.children].forEach((c, i) => {
        c.classList.remove('picked', 'dropped');
        if (act.choice === 'reset') c.classList.add('dropped');
        else if (i === act.choice) c.classList.add('picked');
        else c.classList.add('dropped');
      });
      note.textContent = act.choice === 'reset' ? '원곡 유지' : 'STRATEGY 사용';
      note.className = 'str-note on';

      if (act.choice !== 'reset') {
        setTimeout(() => {
          if (strSig !== sig) return;
          [...wrap.children].forEach((c) => {
            if (c.classList.contains('dropped')) c.classList.add('collapsed');
          });
        }, 560);
      }
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function asArray(v) { return Array.isArray(v) ? v : []; }

  function renderPicks(animate) {

    const maxLen = Math.max(
            asArray(state.songs && state.songs.left).length,
            asArray(state.songs && state.songs.right).length
    );
    const layout = maxLen === 2 ? 'duo' : maxLen === 5 ? 'penta' : 'trio';
    const picksEl = document.querySelector('.picks');
    if (picksEl && picksEl.dataset.layout !== layout) picksEl.dataset.layout = layout;

    ['left', 'right'].forEach((side) => {
      const ul = document.getElementById(`picks-${side}`);
      const songs = asArray(state.songs && state.songs[side]);
      const sig = JSON.stringify(songs);
      if (!animate && pickCache[side] === sig) return;
      pickCache[side] = sig;

      while (ul.children.length > songs.length) ul.lastElementChild.remove();
      while (ul.children.length < songs.length) ul.appendChild(makePick());

      songs.forEach((song, i) => updatePick(ul.children[i], song, i, animate));
    });
  }

  const timelines = new Map();
  const timelineSrc = new Map();

  let combinedVideo = null;
  let combinedSrc = '';
  let combinedRAF = null;
  const canvasEls = new Map();

  const cursor = new Int32Array(32);

  const timelineStatus = {};
  let statusPushTimer = null;

  function reportTimelineStatus(i, state_, detail) {
    timelineStatus[i] = { state: state_, detail: detail || '' };
    clearTimeout(statusPushTimer);
    statusPushTimer = setTimeout(() => {
      fetch('/api/diag', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ timelines: timelineStatus })
      }).catch(() => {});
    }, 200);
  }

  async function loadTimeline(i, url) {
    if (timelineSrc.get(i) === url) return;
    timelineSrc.set(i, url);
    timelines.delete(i);
    if (i < cursor.length) cursor[i] = 0;
    if (!url) { reportTimelineStatus(i, 'empty'); return; }
    try {
      const res = await fetch(url);

      if (!res.ok) throw new Error(`HTTP ${res.status} — 파일을 찾을 수 없습니다`);
      const json = await res.json();
      const pts = json.points || [];
      if (!Array.isArray(pts) || !pts.length) throw new Error('points 가 비어 있습니다');
      timelines.set(i, {
        t: Float64Array.from(pts, (p) => p[0]),
        s: Float64Array.from(pts, (p) => p[1])
      });
      const last = pts[pts.length - 1];
      reportTimelineStatus(i, 'ok', `${pts.length}샘플 / 최종 ${Number(last[1]).toLocaleString('en-US')}`);
    } catch (e) {
      console.warn('타임라인 로드 실패:', url, e);
      reportTimelineStatus(i, 'error', e.message);
    }
  }

  function scoreAt(i, time) {
    const tl = timelines.get(i);
    if (!tl || !tl.t.length) return null;
    if (time <= tl.t[0]) return tl.s[0];
    let lo = 0, hi = tl.t.length - 1;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (tl.t[mid] <= time) lo = mid; else hi = mid - 1;
    }
    return tl.s[lo];
  }

  function scoreAtSmooth(i, time) {
    const tl = timelines.get(i);
    if (!tl || !tl.t.length) return null;
    const t = tl.t, s = tl.s, n = t.length;

    if (time <= t[0]) return s[0];
    if (time >= t[n - 1]) return s[n - 1];

    let lo = i < cursor.length ? cursor[i] : 0;
    if (lo >= n - 1 || t[lo] > time) lo = 0;
    while (lo < n - 2 && t[lo + 1] <= time) lo++;
    if (i < cursor.length) cursor[i] = lo;

    const t0 = t[lo], t1 = t[lo + 1];
    const span = t1 - t0;
    if (span <= 0) return s[lo];
    return s[lo] + (s[lo + 1] - s[lo]) * ((time - t0) / span);
  }

  function renderFeeds() {
    const wrap = document.getElementById('feeds');
    const slots = asArray(state.match && state.match.slots);

    const cols = String(slots.length || 4);
    if (wrap.dataset.cols !== cols) {
      wrap.dataset.cols = cols;
      wrap.style.setProperty('--feed-cols', cols);
    }

    if (wrap.children.length !== slots.length) {
      wrap.innerHTML = '';
      canvasEls.clear();

      [...timelines.keys()].forEach((k) => { if (k >= slots.length) timelines.delete(k); });
      [...timelineSrc.keys()].forEach((k) => { if (k >= slots.length) timelineSrc.delete(k); });
      for (let k = slots.length; k < cursor.length; k++) cursor[k] = 0;
      if (combinedVideo) { combinedVideo.remove(); combinedVideo = null; combinedSrc = ''; }
      if (combinedRAF) { cancelAnimationFrame(combinedRAF); combinedRAF = null; }

      slots.forEach(() => {
        const feed = document.createElement('div');
        feed.className = 'feed';
        feed.innerHTML =
                '<div class="rank"></div>' +
                '<div class="frame"><div class="placeholder">NO SIGNAL</div></div>' +
                '<div class="plate"><div class="avatar"></div><div class="brush"><span></span></div></div>';
        wrap.appendChild(feed);
      });
    }

    slots.forEach((slot, i) => {
      const feed = wrap.children[i];
      loadTimeline(i, slot.timeline || '');

      if (feed.dataset.team !== (slot.team || '')) feed.dataset.team = slot.team || '';
      const rankEl = feed.querySelector('.rank');

      if (!state.match.autoRank) {
        if (rankEl.textContent !== (slot.rank || '')) rankEl.textContent = slot.rank || '';
        lastRankText[i] = null;
      }
      const nameEl = feed.querySelector('.plate .brush span');
      if (nameEl.textContent !== (slot.player || '')) nameEl.textContent = slot.player || '';
      const avatarEl = feed.querySelector('.plate .avatar');
      const bg = slot.icon ? `url("${slot.icon}")` : '';
      if (avatarEl.dataset.bg !== bg) { avatarEl.dataset.bg = bg; avatarEl.style.backgroundImage = bg; }
    });

    renderCombinedFeeds(slots);
  }

  function renderCombinedFeeds(slots) {
    const wrap = document.getElementById('feeds');
    const src = state.match.combinedVideo;

    invalidateDrawPlan();
    lastDrawnTime = -1;

    if (!combinedVideo) {
      combinedVideo = document.createElement('video');
      combinedVideo.muted = false;
      combinedVideo.playsInline = true;
      combinedVideo.preload = 'auto';
      combinedVideo.style.cssText = 'position:fixed; left:-9999px; top:-9999px; width:1px; height:1px;';
      document.body.appendChild(combinedVideo);
    }
    if (combinedSrc !== src) {
      combinedSrc = src;
      combinedVideo.src = src;
      combinedVideo.load();
    }

    slots.forEach((slot, i) => {
      const feed = wrap.children[i];
      const frame = feed.querySelector('.frame');
      const placeholder = frame.querySelector('.placeholder');
      let canvas = canvasEls.get(i);

      if (src && slot.crop) {
        if (!canvas) {
          canvas = document.createElement('canvas');
          canvas.style.cssText = 'position:absolute; inset:0; width:100%; height:100%;';
          frame.insertBefore(canvas, placeholder.nextSibling);
          canvasEls.set(i, canvas);
        }
        placeholder.style.display = 'none';
      } else {
        if (canvas) { canvas.remove(); canvasEls.delete(i); }
        placeholder.style.display = '';
      }
    });

    if (!combinedRAF) drawCombinedFrame();
  }

  let drawPlan = null;
  let lastDrawnTime = -1;

  function invalidateDrawPlan() { drawPlan = null; }
  addEventListener('resize', invalidateDrawPlan);

  function buildDrawPlan() {
    const vw = combinedVideo.videoWidth, vh = combinedVideo.videoHeight;
    const slots = asArray(state.match && state.match.slots);
    const plan = [];

    const add = (canvas, c) => {
      if (!canvas || !c) return;
      const sx = Math.round((c.x / 100) * vw), sy = Math.round((c.y / 100) * vh);
      const sw = Math.round((c.w / 100) * vw), sh = Math.round((c.h / 100) * vh);
      if (sw <= 0 || sh <= 0) return;

      const rect = canvas.getBoundingClientRect();
      const dw = Math.max(1, Math.round(rect.width)), dh = Math.max(1, Math.round(rect.height));
      if (canvas.width !== dw || canvas.height !== dh) { canvas.width = dw; canvas.height = dh; }

      const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
      plan.push({ ctx, sx, sy, sw, sh, dw, dh });
    };

    const hud = state.match && state.match.hudCrop;
    const hudEl = document.getElementById('hud-banner');
    if (hud && hudEl && hudEl.classList.contains('on')) add(hudEl, hud);

    slots.forEach((slot, i) => add(canvasEls.get(i), slot.crop));
    return plan;
  }

  function drawCombinedFrame() {
    combinedRAF = requestAnimationFrame(drawCombinedFrame);
    if (!combinedVideo || !combinedVideo.videoWidth) return;

    const t = combinedVideo.currentTime;
    if (t === lastDrawnTime) return;
    lastDrawnTime = t;

    if (!drawPlan) drawPlan = buildDrawPlan();
    for (let i = 0; i < drawPlan.length; i++) {
      const p = drawPlan[i];
      p.ctx.drawImage(combinedVideo, p.sx, p.sy, p.sw, p.sh, 0, 0, p.dw, p.dh);
    }
  }

  function formatDiff(n) {
    const a = Math.abs(Math.round(n));
    if (a < 1000) return String(a);
    if (a < 999500) {
      const v = a / 1000;
      return trimZeros(v < 100 ? v.toFixed(1) : v.toFixed(0)) + 'k';
    }
    const v = a / 1e6;
    return trimZeros(v < 10 ? v.toFixed(2) : v.toFixed(1)) + 'M';
  }

  function trimZeros(str) {
    return str.indexOf('.') < 0 ? str : str.replace(/0+$/, '').replace(/\.$/, '');
  }

  const meterDom = {};
  function meterEls() {
    if (!meterDom.left) {
      meterDom.left = document.getElementById('meter-left');
      meterDom.right = document.getElementById('meter-right');
      meterDom.knob = document.getElementById('meter-knob');
      meterDom.label = document.getElementById('meter-label');
    }
    if (!meterDom.width) {
      const track = meterDom.knob.parentElement;
      meterDom.width = track ? track.clientWidth : 0;
    }
    return meterDom;
  }
  addEventListener('resize', () => { meterDom.width = 0; });

  let lastPct = null, lastLabel = null, lastLead = null;

  function setMeter(ratio, label, lead) {
    const el = meterEls();
    const leftPct = 50 - Math.max(-1, Math.min(1, ratio)) * 50;
    const pct = Math.round(leftPct * 100) / 100;

    if (pct !== lastPct) {
      lastPct = pct;

      el.left.style.transform = `scaleX(${pct / 100})`;
      el.right.style.transform = `scaleX(${(100 - pct) / 100})`;
      el.knob.style.transform = `translateX(${(pct / 100) * el.width}px)`;
    }
    if (lead !== lastLead) {
      const flipped = lastLead && lead && lastLead !== lead;
      lastLead = lead;
      el.knob.classList.toggle('lead-left', lead === 'left');
      el.knob.classList.toggle('lead-right', lead === 'right');
      if (flipped) {

        el.knob.classList.remove('flip');
        void el.knob.offsetWidth;
        el.knob.classList.add('flip');
      }
    }
    if (label !== lastLabel) {
      lastLabel = label;
      el.label.textContent = label;
    }
  }

  function badgeTexts() {
    const m = state.match || {};
    const b = m.badges || {};
    if (b.mode === 'manual') {
      const L = b.left || '', R = b.right || '';

      return { left: L, right: R,
        leftStr: /STRATEGY/i.test(L), rightStr: /STRATEGY/i.test(R) };
    }

    const idx = Number(m.currentSong);
    const side = m.currentSide;
    if (!side || !Number.isFinite(idx)) return { left: '', right: '', leftStr: false, rightStr: false };

    const song = asArray(state.songs && state.songs[side])[idx];
    if (!song) return { left: '', right: '', leftStr: false, rightStr: false };

    const st = state.strategy || {};
    const replaced = st.replacedSide === side && Number(st.replacedIndex) === idx;

    const out = { left: '', right: '', leftStr: false, rightStr: false };
    if (replaced) {
      out[side] = 'STRATEGY';
      out[side + 'Str'] = true;
    } else {
      out[side] = '자선곡';
    }
    return out;
  }

  function renderBadges() {
    const t = badgeTexts();
    const bar = document.querySelector('.matchbar');
    const logos = bar ? bar.querySelectorAll('.team-logo.sm') : [];

    [['left', t.left, t.leftStr, 0], ['right', t.right, t.rightStr, 1]].forEach(
            ([side, text, isStr, li]) => {
              const el = document.getElementById(`badge-${side}`);
              if (!el) return;

              const line1 = isStr ? text : 'Track Selected By';
              const line2 = isStr ? '' : '자선곡 플레이 중';
              const sig = `${text}|${isStr}`;
              if (el.dataset.sig !== sig) {
                el.dataset.sig = sig;
                el.innerHTML = isStr
                        ? `<span class="badge-line b1">${line1}</span>`
                        : `<span class="badge-line b1">${line1}</span><span class="badge-line b2">${line2}</span>`;
              }
              el.classList.toggle('on', !!text);
              el.classList.toggle('str', !!isStr);

              const logo = logos[li];
              if (logo && text) {
                const lb = logo.offsetLeft, lw = logo.offsetWidth;
                const ltop = logo.offsetTop, lh = logo.offsetHeight;
                el.style.left = `${lb + (lw - el.offsetWidth) / 2}px`;
                el.style.top = `${ltop + lh + 12}px`;
              }
            });
  }

  function renderMeter() {
    const m = state.match || {};

    const useHud = !!m.hudCrop && !!m.combinedVideo;
    const hudEl = document.getElementById('hud-banner');
    if (hudEl && hudEl.classList.contains('on') !== useHud) {
      hudEl.classList.toggle('on', useHud);
      invalidateDrawPlan();
    }

    const bar = document.querySelector('.matchbar');
    if (bar) bar.classList.toggle('has-hud', useHud);
    const feedsEl = document.getElementById('feeds');
    if (feedsEl) {
      feedsEl.style.top = useHud ? '290px' : '';

      if (feedsEl.classList.contains('has-hud') !== useHud) {
        feedsEl.classList.toggle('has-hud', useHud);
        invalidateDrawPlan();
      }
    }

    const meterEl = document.getElementById('meter');
    meterEl.style.display = useHud ? 'none' : '';
    meterEl.parentElement.style.visibility =
            (!useHud && m.meterVisible === false) ? 'hidden' : 'visible';

    if (!useHud && !m.autoMeter) setMeter(Number(m.meter) || 0, m.label || '', '');
    lastTickTime = -1;
  }

  let lastLabelAt = 0;
  let cachedLabel = '';
  let lastTickTime = -1;
  let lastRankAt = 0;

  const METER_SMOOTH_TAU = 1.2;
  const LEAD_FLIP_HOLD_MS = 1500;
  let smoothDiff = null;
  let lastSmoothAt = 0;
  let lastSmoothVideoTime = -1;
  let leadSign = 0;
  let leadCandidateSince = 0;

  const RANK_LABEL = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th'];
  const lastRankText = [];

  function updateRanks(values) {
    const wrap = document.getElementById('feeds');
    if (!wrap) return;

    const order = [];
    for (let i = 0; i < values.length; i++) {
      if (values[i] != null) order.push({ i, v: values[i] });
    }
    if (!order.length) return;
    order.sort((a, b) => b.v - a.v);

    let rank = 0, prevVal = null;
    for (let k = 0; k < order.length; k++) {
      if (prevVal === null || order[k].v !== prevVal) rank = k + 1;
      prevVal = order[k].v;
      const text = RANK_LABEL[rank - 1] || `${rank}th`;
      const idx = order[k].i;
      if (lastRankText[idx] !== text) {
        const hadPrev = lastRankText[idx] != null;
        lastRankText[idx] = text;
        const feed = wrap.children[idx];
        const el = feed && feed.querySelector('.rank');
        if (el) {
          el.textContent = text;
          if (hadPrev) {
            el.classList.remove('bump');
            void el.offsetWidth;
            el.classList.add('bump');
          }
        }
      }
    }
  }

  function autoTick(now) {
    requestAnimationFrame(autoTick);
    if (!state || state.view !== 'match') return;

    if (state.match.hudCrop) return;
    const wantMeter = !!state.match.autoMeter;
    const wantRank = !!state.match.autoRank;
    if (!wantMeter && !wantRank) return;

    const slots = asArray(state.match && state.match.slots);
    if (!combinedVideo || !slots.length) return;

    const mt = combinedVideo.currentTime;
    if (mt === lastTickTime) return;
    lastTickTime = mt;

    const resetAt = state.match.songResetAt;
    const useReset = Number.isFinite(resetAt) && resetAt >= 0;

    const values = [];
    let left = 0, right = 0, found = false;
    for (let i = 0; i < slots.length; i++) {
      const slot = slots[i];
      let v = scoreAtSmooth(i, mt);
      if (v != null && useReset) {
        const base0 = scoreAtSmooth(i, resetAt);
        if (base0 != null) v = Math.max(0, v - base0);
      }
      values.push(v);
      if (v == null) continue;
      found = true;
      if (slot.team === 'right') right += v; else left += v;
    }
    if (!found) return;

    if (wantRank && now - lastRankAt >= 500) {
      lastRankAt = now;
      updateRanks(values);
    }
    if (!wantMeter) return;

    const rawDiff = right - left;
    const max = Number(state.match.maxDiff) || 150000;

    // 지수이동평균으로 순간 튐을 완화. 시간 기반 가중치라 fps에 무관.
    const dt = lastSmoothAt ? Math.min(0.5, (now - lastSmoothAt) / 1000) : 0;
    lastSmoothAt = now;
    if (smoothDiff == null || Math.abs(mt - lastSmoothVideoTime) > 2) {
      smoothDiff = rawDiff;
      leadSign = Math.sign(rawDiff);
      leadCandidateSince = 0;
    } else {
      const alpha = 1 - Math.exp(-dt / METER_SMOOTH_TAU);
      smoothDiff += (rawDiff - smoothDiff) * alpha;
    }
    lastSmoothVideoTime = mt;

    // 리드 방향은 새 방향이 일정 시간 유지될 때만 바꾼다 (순간 튐으로 뒤집히지 않게)
    const rawSign = Math.sign(smoothDiff);
    if (rawSign !== 0 && rawSign !== leadSign) {
      if (!leadCandidateSince) leadCandidateSince = now;
      else if (now - leadCandidateSince >= LEAD_FLIP_HOLD_MS) {
        leadSign = rawSign;
        leadCandidateSince = 0;
      }
    } else {
      leadCandidateSince = 0;
    }

    // 표시값: 부호가 아직 확정 안 됐으면 이전 방향 쪽으로 0에 붙여둠
    let diff = smoothDiff;
    if (rawSign !== 0 && rawSign !== leadSign) diff = 0;
    const lead = leadSign > 0 ? 'right' : leadSign < 0 ? 'left' : '';

    if (now - lastLabelAt >= 500) {
      lastLabelAt = now;
      const rounded = Math.round(diff);
      cachedLabel = state.match.labelStyle === 'full'
              ? Math.abs(rounded).toLocaleString('en-US')
              : formatDiff(rounded);
    }

    setMeter(diff / max, cachedLabel, lead);
  }
  requestAnimationFrame(autoTick);

  let prevView = null;

  function render() {
    state.view = normView(state.view);
    const viewChanged = prevView !== state.view;
    prevView = state.view;

    document.querySelectorAll('.view').forEach((v) => {
      v.classList.toggle('active', v.dataset.view.split(' ').includes(state.view));
    });
    applyBindings();
    if (state.view === 'songs') { renderPicks(viewChanged); renderStrategy(); }
    else document.getElementById('str-panel').classList.remove('on');
    if (state.view === 'match') { renderFeeds(); renderMeter(); renderBadges(); }
  }

  function seekAll(t) {
    if (combinedVideo) combinedVideo.currentTime = Math.max(0, t);
  }

  function allVideos() {
    return combinedVideo ? [combinedVideo] : [];
  }

  function handleCmd(cmd) {
    switch (cmd.type) {
      case 'play':
        allVideos().forEach((v) => v.play().catch(() => {}));
        break;
      case 'pause':
        allVideos().forEach((v) => v.pause());
        break;
      case 'seek':
        seekAll(Number(cmd.t) || 0);
        break;
      case 'restart':
        seekAll(0);
        allVideos().forEach((v) => v.play().catch(() => {}));
        break;
      case 'replayBan':
        document.querySelectorAll('.ban-mark, .ban-burst').forEach((el) => el.remove());
        pickCache.left = pickCache.right = '';
        renderPicks(false);
        break;
      case 'replayStrategy':
        strSig = '';
        renderStrategy();
        break;
      case 'songReset': {
        smoothDiff = null; leadSign = 0; leadCandidateSince = 0;
        const at = combinedVideo ? combinedVideo.currentTime : 0;
        fetch('/api/state', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ match: { songResetAt: at } })
        }).catch(() => {});
        break;
      }
      case 'songResetClear':
        smoothDiff = null; leadSign = 0; leadCandidateSince = 0;
        fetch('/api/state', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ match: { songResetAt: null } })
        }).catch(() => {});
        break;
      case 'reload':
        location.reload();
        break;
    }
  }
/ㅣ
  function connect() {
    const es = new EventSource('/api/events');
    es.addEventListener('state', (e) => { state = JSON.parse(e.data); render(); });
    es.addEventListener('cmd', (e) => handleCmd(JSON.parse(e.data)));
    es.onerror = () => { es.close(); setTimeout(connect, 1500); };
  }
  connect();

</script>
</body>
</html>
